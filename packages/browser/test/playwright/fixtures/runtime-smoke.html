<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hydra Browser Smoke</title>
    <script type="importmap">
      {
        "imports": {
          "hydra-synth-core": "/packages/core/dist/index.js"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import {
        BrowserHost,
        HydraBrowserRuntime,
        WEBGPU_UNAVAILABLE_MESSAGE,
        WebGPURenderer
      } from '/packages/browser/dist/index.js'

      const params = new URLSearchParams(window.location.search)
      const mode = params.get('mode') ?? 'default'

      const publish = (result) => {
        window.__hydraSmokeResult = result
        window.__hydraSmokeDone = true
      }

      const toMessage = (value) => {
        if (!value) return ''
        if (typeof value === 'string') return value
        if (value instanceof Error) return value.message
        if (typeof value === 'object' && typeof value.message === 'string') return value.message
        return String(value)
      }

      const toCause = (value) => {
        if (!value || typeof value !== 'object') return null
        if (value.envelope && typeof value.envelope === 'object') {
          return value.envelope.cause ?? null
        }
        return value.cause ?? null
      }

      const run = async () => {
        const host = new BrowserHost({
          width: 320,
          height: 180,
          autoAppend: false
        })

        if (mode === 'force-unavailable') {
          host.canvas.getContext = () => null
        }

        const executionMode = mode === 'fragment' || mode === 'auto'
          ? mode
          : undefined

        const renderer = new WebGPURenderer({ canvas: host.canvas })
        const runtime = new HydraBrowserRuntime({
          host,
          renderer,
          autoLoop: false,
          errorPolicy: 'throw',
          ...(executionMode ? { executionMode } : {})
        })

        try {
          if ((mode === 'fragment' || mode === 'auto' || mode === 'default') && !navigator.gpu) {
            publish({ status: 'no-webgpu', requestedMode: mode })
            return
          }

          await runtime.init()
          const synth = runtime.synth
          synth.solid(1, 0, 0, 1).out()
          runtime.tick(16)
          const snapshot = runtime.getProfilerSnapshot()
          runtime.dispose()
          publish({
            status: 'ok',
            requestedMode: mode,
            configuredMode: snapshot.scheduler.routingConfiguredMode,
            activeMode: snapshot.scheduler.routingActiveMode,
            routingRouteFailureCount: snapshot.scheduler.routingRouteFailureCount,
            routingCompileFailures: snapshot.scheduler.routingCompileFailures
          })
        } catch (error) {
          const message = toMessage(error)
          const causeMessage = toMessage(toCause(error))
          const isUnavailableError = (
            message.includes('WebGPU context creation failed') ||
            message.includes(WEBGPU_UNAVAILABLE_MESSAGE) ||
            message.includes('No compatible GPU adapter') ||
            causeMessage.includes('WebGPU context creation failed') ||
            causeMessage.includes(WEBGPU_UNAVAILABLE_MESSAGE) ||
            causeMessage.includes('No compatible GPU adapter')
          )

          runtime.dispose()
          if ((mode === 'fragment' || mode === 'auto') && isUnavailableError) {
            publish({
              status: 'no-webgpu',
              requestedMode: mode,
              message,
              causeMessage
            })
            return
          }
          if (mode === 'default' && isUnavailableError) {
            publish({
              status: 'no-webgpu',
              requestedMode: mode,
              message,
              causeMessage
            })
            return
          }
          publish({
            status: 'error',
            message,
            causeMessage,
            expectedUnavailableMessage: WEBGPU_UNAVAILABLE_MESSAGE
          })
        }
      }

      run()
    </script>
  </body>
</html>
