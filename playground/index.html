<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hydra v2 Playground</title>
  <script type="importmap">
      {
        "imports": {
          "hydra-synth-core": "../packages/core/dist/index.js",
          "hydra-synth": "../packages/browser/dist/index.js",
          "hydra-synth-livecoding": "../packages/livecoding/dist/index.js"
        }
      }
    </script>
  <style>
    :root {
      color-scheme: light;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      background: #10151f;
      color: #dbe8ff;
    }

    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 10;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(15, 20, 30, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-size: 12px;
      line-height: 1.4;
      max-width: min(420px, calc(100vw - 32px));
    }

    #capture-controls {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    #capture-duration-label {
      font-size: 11px;
      color: #a7bad8;
    }

    #capture-duration-input {
      width: 68px;
      border: 1px solid rgba(141, 229, 255, 0.38);
      background: rgba(1, 5, 12, 0.45);
      color: #dbe8ff;
      border-radius: 6px;
      padding: 5px 7px;
      font-size: 12px;
    }

    #capture-duration-input:disabled {
      opacity: 0.6;
    }

    .capture-toggle {
      border: 1px solid rgba(141, 229, 255, 0.4);
      background: rgba(141, 229, 255, 0.14);
      color: #dbe8ff;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 12px;
    }

    .capture-toggle:hover {
      background: rgba(141, 229, 255, 0.22);
    }

    .capture-toggle[data-state="active"] {
      border-color: rgba(255, 140, 140, 0.55);
      background: rgba(255, 92, 92, 0.2);
    }

    #capture-status {
      margin-top: 2px;
      flex-basis: 100%;
      min-height: 1em;
      font-size: 11px;
      color: #a7bad8;
    }

    #capture-status[data-state="ok"] {
      color: #96f6ad;
    }

    #capture-status[data-state="error"] {
      color: #ff9494;
    }

    #live-panel {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 11;
      width: min(560px, calc(100vw - 24px));
      max-height: min(48vh, 440px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(141, 229, 255, 0.34);
      background: rgba(8, 13, 21, 0.88);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
    }

    #live-panel[hidden] {
      display: none;
    }

    #live-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    #live-run {
      border: 1px solid rgba(141, 229, 255, 0.4);
      background: rgba(141, 229, 255, 0.12);
      color: #dbe8ff;
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 12px;
    }

    #live-run:hover {
      background: rgba(141, 229, 255, 0.2);
    }

    #live-editor {
      width: 100%;
      flex: 1;
      min-height: 130px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      background: rgba(1, 5, 12, 0.7);
      color: #dbe8ff;
      font: inherit;
      line-height: 1.45;
      padding: 10px;
      resize: vertical;
      tab-size: 2;
    }

    #live-status {
      min-height: 1em;
      font-size: 11px;
      color: #a7bad8;
    }

    #live-status[data-state="ok"] {
      color: #96f6ad;
    }

    #live-status[data-state="error"] {
      color: #ff9494;
    }

    code {
      color: #8de5ff;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    @media (max-width: 900px) {
      #live-panel {
        left: 8px;
        right: 8px;
        bottom: 8px;
        width: auto;
        max-height: 46vh;
      }
    }
  </style>
</head>

<body>
  <div id="hud">
    <div><strong>Hydra v2 Playground</strong></div>
    <div>Console globals are exposed (for development only).</div>
    <div>Try: <code>osc(10, 0.1, 0).out()</code></div>
    <div>Runtime is available as <code>hydra</code>.</div>
    <div id="livecoding-note">Live editor: add <code>?livecoding=1</code>.</div>
    <div id="capture-controls">
      <label id="capture-duration-label" for="capture-duration-input">Duration (s)</label>
      <input id="capture-duration-input" type="number" min="0.1" max="600" step="0.1" value="2" inputmode="decimal" />
      <button id="capture-gif-toggle" class="capture-toggle" type="button">Capture and Save GIF (2s)</button>
      <button id="capture-video-toggle" class="capture-toggle" type="button">Capture and Save MP4 (2s)</button>
      <div id="capture-status"></div>
    </div>
  </div>

  <div id="live-panel" hidden>
    <div id="live-panel-header">
      <strong>Livecoding Editor</strong>
      <button id="live-run" type="button">Run Selection/Line (Ctrl/Cmd+Enter)</button>
    </div>
    <textarea id="live-editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
    <div id="live-status"></div>
  </div>

  <script type="module">
    import { buildFfmpegCommands, captureHydraFrameSequence, captureHydraVideo, createHydraBrowserRuntime } from 'hydra-synth'
    import { createLivecodingPlugin } from 'hydra-synth-livecoding'

    const runtime = createHydraBrowserRuntime({
      autoLoop: true,
      numSources: 4,
      numOutputs: 4
    })

    const describeInitError = () => {
      const canvas = runtime.host?.canvas ?? document.querySelector('canvas')
      let hasCanvasWebGpuContext = false
      let contextProbeError = null

      if (canvas) {
        try {
          hasCanvasWebGpuContext = Boolean(canvas.getContext('webgpu'))
        } catch (error) {
          contextProbeError = error instanceof Error ? error.message : String(error)
        }
      }

      return {
        secureContext: typeof window !== 'undefined' ? window.isSecureContext : false,
        hasNavigatorGpu: typeof navigator !== 'undefined' && Boolean(navigator.gpu),
        hasCanvasWebGpuContext,
        contextProbeError,
        url: typeof location !== 'undefined' ? location.href : '',
        userAgent: typeof navigator !== 'undefined' ? navigator.userAgent : ''
      }
    }

    try {
      await runtime.init()
    } catch (error) {
      const diagnostics = describeInitError()
      const summary = [
        'WebGPU init failed.',
        `secureContext=${diagnostics.secureContext}`,
        `navigator.gpu=${diagnostics.hasNavigatorGpu}`,
        `canvas.getContext("webgpu")=${diagnostics.hasCanvasWebGpuContext}`
      ].join(' ')

      const hud = document.getElementById('hud')
      if (hud) {
        const message = document.createElement('div')
        message.style.marginTop = '8px'
        message.style.color = '#ff9494'
        message.textContent = `${summary} Open console for diagnostics.`
        hud.appendChild(message)
      }

      console.error('[hydra] runtime init failed', { diagnostics, error })
      console.info('[hydra] WebGPU checks: verify hardware acceleration, chrome://gpu, and run from https:// or localhost.')
      throw error
    }

    const synth = runtime.synth

    const attachBinding = (name) => {
      Object.defineProperty(window, name, {
        configurable: true,
        enumerable: true,
        get() {
          return synth[name]
        },
        set(value) {
          synth[name] = value
        }
      })
    }

    // Expose all synth entries with live getters/setters for console-driven coding.
    for (const name of Object.keys(synth)) {
      attachBinding(name)
    }

    window.hydra = runtime
    window.synth = synth
    const captureFrames = async (options = {}) => captureHydraFrameSequence({
      runtime,
      ...options
    })
    window.captureFrames = captureFrames
    window.captureHydraFrameSequence = captureFrames
    window.buildFfmpegCommands = buildFfmpegCommands

    // Default scene so users immediately see output.
    if (typeof synth.osc === 'function') {
      synth.osc(12, 0.08, 0).out()
    }

    const params = new URLSearchParams(window.location.search)
    const enableLivecoding = params.get('livecoding') === '1'
    const livePanel = document.getElementById('live-panel')
    const livecodingNote = document.getElementById('livecoding-note')
    const liveEditor = document.getElementById('live-editor')
    const liveRunButton = document.getElementById('live-run')
    const liveStatus = document.getElementById('live-status')
    const captureDurationInput = document.getElementById('capture-duration-input')
    const captureGifToggle = document.getElementById('capture-gif-toggle')
    const captureVideoToggle = document.getElementById('capture-video-toggle')
    const captureStatus = document.getElementById('capture-status')
    const liveEditorStorageKey = 'hydra-playground-livecode'
    const captureBaseNameStorageKey = 'hydra-playground-capture-base-name'
    const captureDurationStorageKey = 'hydra-playground-capture-duration-seconds'
    const defaultCaptureDurationSeconds = 2
    const minCaptureDurationSeconds = 0.1
    const maxCaptureDurationSeconds = 600
    const videoCaptureFormat = 'mp4'
    const defaultLiveSnippet = `osc(18, 0.05, 0)
  .rotate(() => time * 0.08)
  .out()

speed = 0.75`

    const setLiveStatus = (message, state = '') => {
      if (!liveStatus) return
      liveStatus.textContent = message
      if (state) liveStatus.dataset.state = state
      else delete liveStatus.dataset.state
    }

    const setCaptureStatus = (message, state = '') => {
      if (!captureStatus) return
      captureStatus.textContent = message
      if (state) captureStatus.dataset.state = state
      else delete captureStatus.dataset.state
    }

    const loadLiveSnippet = () => {
      try {
        const saved = window.localStorage.getItem(liveEditorStorageKey)
        return saved && saved.trim().length > 0 ? saved : defaultLiveSnippet
      } catch {
        return defaultLiveSnippet
      }
    }

    const persistLiveSnippet = () => {
      if (!liveEditor) return
      try {
        window.localStorage.setItem(liveEditorStorageKey, liveEditor.value)
      } catch {
        // Ignore local storage failures in restricted contexts.
      }
    }

    const parseJsonResponse = async (response) => {
      const text = await response.text()
      let payload = {}

      if (text) {
        try {
          payload = JSON.parse(text)
        } catch {
          payload = { error: text }
        }
      }

      if (!response.ok) {
        const errorMessage = typeof payload.error === 'string'
          ? payload.error
          : `Request failed with status ${response.status}.`
        throw new Error(errorMessage)
      }

      return payload
    }

    const sanitizeOutputBaseName = (value) => String(value ?? '')
      .replace(/[^A-Za-z0-9._-]+/g, '-')
      .replace(/^-+|-+$/g, '')

    const defaultOutputBaseName = () => {
      const now = new Date()
      const pad = (n) => String(n).padStart(2, '0')
      const base = [
        now.getFullYear(),
        pad(now.getMonth() + 1),
        pad(now.getDate()),
        '-',
        pad(now.getHours()),
        pad(now.getMinutes()),
        pad(now.getSeconds())
      ].join('')
      return `hydra-capture-${base}`
    }

    const loadCaptureBaseName = () => {
      try {
        const saved = window.localStorage.getItem(captureBaseNameStorageKey)
        const normalized = sanitizeOutputBaseName(saved)
        return normalized || defaultOutputBaseName()
      } catch {
        return defaultOutputBaseName()
      }
    }

    const saveCaptureBaseName = (value) => {
      try {
        window.localStorage.setItem(captureBaseNameStorageKey, value)
      } catch {
        // Ignore local storage failures in restricted contexts.
      }
    }

    const clampCaptureDurationSeconds = (value) => Math.min(maxCaptureDurationSeconds, Math.max(minCaptureDurationSeconds, value))

    const formatDurationSeconds = (value) => Number.parseFloat(value.toFixed(2)).toString()

    const normalizeCaptureDurationSeconds = (value, fallback = defaultCaptureDurationSeconds) => {
      if (!Number.isFinite(value) || value <= 0) return fallback
      return clampCaptureDurationSeconds(value)
    }

    const readCaptureDurationSeconds = () => {
      if (!captureDurationInput) return defaultCaptureDurationSeconds
      const numeric = Number(captureDurationInput.value)
      return normalizeCaptureDurationSeconds(numeric)
    }

    const setCaptureDurationSeconds = (value) => {
      const normalized = normalizeCaptureDurationSeconds(value)
      if (captureDurationInput) {
        captureDurationInput.value = formatDurationSeconds(normalized)
      }
      try {
        window.localStorage.setItem(captureDurationStorageKey, String(normalized))
      } catch {
        // Ignore local storage failures in restricted contexts.
      }
      return normalized
    }

    const loadCaptureDurationSeconds = () => {
      try {
        const saved = window.localStorage.getItem(captureDurationStorageKey)
        const parsed = Number(saved)
        return normalizeCaptureDurationSeconds(parsed)
      } catch {
        return defaultCaptureDurationSeconds
      }
    }

    const requestCaptureSession = async ({ extension = 'png', signal } = {}) => {
      const response = await fetch('/__capture/start', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ extension }),
        signal
      })
      return parseJsonResponse(response)
    }

    const uploadCaptureFrame = async ({ sessionId, fileName, blob, signal }) => {
      const query = new URLSearchParams({ sessionId, fileName })
      const response = await fetch(`/__capture/frame?${query.toString()}`, {
        method: 'POST',
        body: blob,
        signal
      })
      return parseJsonResponse(response)
    }

    const finalizeCaptureSession = async ({ sessionId, fps, format, outputBaseName, signal }) => {
      const response = await fetch('/__capture/finalize', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ sessionId, fps, format, outputBaseName }),
        signal
      })
      return parseJsonResponse(response)
    }

    const abortCaptureSession = async (sessionId) => {
      await fetch('/__capture/abort', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ sessionId })
      })
    }

    const fetchCaptureResultBlob = async ({ downloadPath, signal }) => {
      const response = await fetch(downloadPath, { method: 'GET', signal })
      if (!response.ok) {
        const text = await response.text()
        throw new Error(text || `Download failed with status ${response.status}.`)
      }
      return response.blob()
    }

    const downloadBlob = ({ blob, fileName }) => {
      const url = URL.createObjectURL(blob)
      const link = document.createElement('a')
      link.href = url
      link.download = fileName
      link.style.display = 'none'
      document.body.appendChild(link)
      link.click()
      // Revoke asynchronously to avoid truncating downloads in some Chromium builds.
      window.setTimeout(() => {
        URL.revokeObjectURL(url)
        link.remove()
      }, 30_000)
    }

    let activeCaptureAbortController = null
    let activeCaptureSessionId = null
    let activeCaptureFormat = null
    let detachLivecoding = null
    let livecodingPlugin = null
    let lastFullBufferBlocks = null

    const captureLabel = (format) => {
      if (format === 'gif') return 'GIF'
      if (format === 'mp4') return 'MP4'
      return 'Capture'
    }

    const resolveRuntimeFps = () => {
      const runtimeFps = Number(synth.fps)
      if (Number.isFinite(runtimeFps) && runtimeFps > 0) return runtimeFps
      return 60
    }

    const updateCaptureButtonState = () => {
      const active = Boolean(activeCaptureAbortController)
      const activeFormat = activeCaptureFormat
      const durationSeconds = formatDurationSeconds(readCaptureDurationSeconds())

      if (captureGifToggle) {
        const isActive = active && activeFormat === 'gif'
        captureGifToggle.textContent = isActive ? 'Stop GIF Capture' : `Capture and Save GIF (${durationSeconds}s)`
        captureGifToggle.disabled = active && !isActive
        if (isActive) captureGifToggle.dataset.state = 'active'
        else delete captureGifToggle.dataset.state
      }

      if (captureVideoToggle) {
        const isActive = active && activeFormat === videoCaptureFormat
        captureVideoToggle.textContent = isActive
          ? 'Stop MP4 Capture'
          : `Capture and Save MP4 (${durationSeconds}s)`
        captureVideoToggle.disabled = active && !isActive
        if (isActive) captureVideoToggle.dataset.state = 'active'
        else delete captureVideoToggle.dataset.state
      }

      if (captureDurationInput) {
        captureDurationInput.disabled = active
      }
    }

    const encodeAndDownloadMedia = async ({ sessionId, fps, outputBaseName, format, signal }) => {
      const label = captureLabel(format)
      setCaptureStatus(`Encoding ${label} with ffmpeg...`)
      const encoded = await finalizeCaptureSession({
        sessionId,
        fps,
        format,
        outputBaseName,
        signal
      })

      const resultBlob = await fetchCaptureResultBlob({
        downloadPath: encoded.downloadPath,
        signal
      })

      downloadBlob({
        blob: resultBlob,
        fileName: encoded.fileName
      })

      return encoded
    }

    const captureAndSaveMedia = async (options = {}) => {
      if (activeCaptureAbortController) {
        throw new Error('A capture is already in progress.')
      }

      const format = String(options.format ?? 'gif').toLowerCase()
      if (format !== 'gif' && format !== 'mp4') {
        throw new Error('captureAndSaveMedia: format must be gif or mp4.')
      }
      const label = captureLabel(format)
      const fps = Number.isFinite(options.fps) && Number(options.fps) > 0 ? Number(options.fps) : resolveRuntimeFps()
      const fallbackDuration = readCaptureDurationSeconds()
      const duration = Number.isFinite(options.duration) && Number(options.duration) > 0
        ? normalizeCaptureDurationSeconds(Number(options.duration), fallbackDuration)
        : fallbackDuration
      const width = Number.isFinite(options.width) && Number(options.width) > 0 ? Math.floor(options.width) : undefined
      const height = Number.isFinite(options.height) && Number(options.height) > 0 ? Math.floor(options.height) : undefined
      const defaultFrameExtension = 'png'
      const frameExtension = options.extension ?? defaultFrameExtension
      const outputBaseName = sanitizeOutputBaseName(options.outputBaseName ?? loadCaptureBaseName()) || defaultOutputBaseName()
      const abortController = new AbortController()

      activeCaptureAbortController = abortController
      activeCaptureFormat = format
      updateCaptureButtonState()
      setCaptureStatus(`Starting ${label} capture session...`)

      let shouldCleanupSession = false
      let uploadedFrameCount = 0
      let encodeFps = fps

      try {
        if (format === 'mp4') {
          if (typeof VideoEncoder === 'undefined' || typeof VideoFrame === 'undefined') {
            throw new Error('WebCodecs is not available in this browser context. MP4 capture requires VideoEncoder support.')
          }

          const realtime = options.realtime !== false
          setCaptureStatus(`Capturing MP4 with WebCodecs at ${fps} fps${realtime ? ' (real-time)' : ''}...`)
          const videoBlob = await captureHydraVideo({
            runtime,
            fps,
            duration,
            width,
            height,
            realtime,
            waitForGPU: true,
            resumeAfterCapture: true,
            restoreResolution: true,
            ignoreEngineFpsGate: false,
            signal: abortController.signal,
            onProgress: (percent) => {
              setCaptureStatus(`Encoding MP4 (${percent.toFixed(1)}%)...`)
            }
          })

          if (abortController.signal.aborted) {
            throw new Error('Capture aborted.')
          }

          const fileName = `${outputBaseName}.mp4`
          const downloadVideoBlob = videoBlob.type === 'video/mp4'
            ? videoBlob
            : new Blob([videoBlob], { type: 'video/mp4' })
          downloadBlob({
            blob: downloadVideoBlob,
            fileName
          })
          saveCaptureBaseName(outputBaseName)
          setCaptureStatus(`Saved ${fileName} to your downloads folder.`, 'ok')
          return {
            fileName,
            mimeType: 'video/mp4'
          }
        }

        const session = await requestCaptureSession({ extension: frameExtension, signal: abortController.signal })
        activeCaptureSessionId = String(session.sessionId)
        shouldCleanupSession = true

        setCaptureStatus('Capturing frames...')
        const captureResult = await captureHydraFrameSequence({
          runtime,
          fps,
          duration,
          width,
          height,
          extension: frameExtension,
          waitForRAF: false,
          downloadFallback: false,
          signal: abortController.signal,
          onFrameBlob: async ({ fileName, blob, frameNumber, totalFrames }) => {
            setCaptureStatus(`Uploading frame ${frameNumber}/${totalFrames}...`)
            await uploadCaptureFrame({
              sessionId: activeCaptureSessionId,
              fileName,
              blob,
              signal: abortController.signal
            })
            uploadedFrameCount += 1
          }
        })
        encodeFps = captureResult.fps

        if (abortController.signal.aborted) {
          throw new Error('Capture aborted.')
        }

        const encoded = await encodeAndDownloadMedia({
          sessionId: activeCaptureSessionId,
          fps: captureResult.fps,
          format,
          outputBaseName,
          signal: abortController.signal
        })

        shouldCleanupSession = false
        saveCaptureBaseName(outputBaseName)
        setCaptureStatus(`Saved ${encoded.fileName} to your downloads folder.`, 'ok')
        return encoded
      } catch (error) {
        if (abortController.signal.aborted) {
          if (uploadedFrameCount > 0 && activeCaptureSessionId) {
            try {
              setCaptureStatus(`Stopped. Encoding ${uploadedFrameCount} frame(s) to ${label}...`)
              const encoded = await encodeAndDownloadMedia({
                sessionId: activeCaptureSessionId,
                fps: encodeFps,
                format,
                outputBaseName,
                signal: undefined
              })
              shouldCleanupSession = false
              saveCaptureBaseName(outputBaseName)
              setCaptureStatus(`Saved ${encoded.fileName} to your downloads folder.`, 'ok')
              return encoded
            } catch (encodeError) {
              const message = encodeError instanceof Error ? encodeError.message : String(encodeError)
              setCaptureStatus(`Capture failed after stop: ${message}`, 'error')
              console.error('[hydra] partial capture encode failed', encodeError)
              return null
            }
          }
          setCaptureStatus('Capture cancelled.', '')
          return null
        }

        const message = error instanceof Error ? error.message : String(error)
        setCaptureStatus(`Capture failed: ${message}`, 'error')
        console.error('[hydra] capture failed', error)
        throw error
      } finally {
        if (shouldCleanupSession && activeCaptureSessionId) {
          try {
            await abortCaptureSession(activeCaptureSessionId)
          } catch {
            // Cleanup is best effort if the server session already ended.
          }
        }
        activeCaptureAbortController = null
        activeCaptureSessionId = null
        activeCaptureFormat = null
        updateCaptureButtonState()
      }
    }

    const captureAndSaveGif = async (options = {}) => captureAndSaveMedia({ ...options, format: 'gif' })
    const captureAndSaveVideo = async (options = {}) => captureAndSaveMedia({ ...options, format: 'mp4' })
    const captureAndSaveMp4 = async (options = {}) => captureAndSaveMedia({ ...options, format: 'mp4' })
    const captureAndSaveWebm = async () => {
      throw new Error('captureAndSaveWebm is no longer available in the playground. Use captureAndSaveMp4() for WebCodecs capture.')
    }

    const toggleMediaCapture = (format) => {
      if (activeCaptureAbortController) {
        const runningLabel = captureLabel(activeCaptureFormat)
        const requestedLabel = captureLabel(format)
        if (activeCaptureFormat === format) setCaptureStatus(`Stopping ${runningLabel} capture...`)
        else setCaptureStatus(`Stopping ${runningLabel} capture before starting ${requestedLabel}...`)
        activeCaptureAbortController.abort()
        return
      }

      void captureAndSaveMedia({ format }).catch(() => { })
    }

    const toggleGifCapture = () => {
      toggleMediaCapture('gif')
    }
    const toggleVideoCapture = () => {
      toggleMediaCapture('mp4')
    }

    window.captureAndSaveMedia = captureAndSaveMedia
    window.captureAndSaveGif = captureAndSaveGif
    window.captureAndSaveVideo = captureAndSaveVideo
    window.captureAndSaveMp4 = captureAndSaveMp4
    window.captureAndSaveWebm = captureAndSaveWebm
    window.toggleGifCapture = toggleGifCapture
    window.toggleVideoCapture = toggleVideoCapture
    window.toggleMp4Capture = toggleVideoCapture
    setCaptureDurationSeconds(loadCaptureDurationSeconds())
    updateCaptureButtonState()

    const getLiveSelectionSnippet = () => {
      if (!liveEditor) return ''
      const start = Math.max(0, Math.min(liveEditor.value.length, liveEditor.selectionStart ?? 0))
      const end = Math.max(start, Math.min(liveEditor.value.length, liveEditor.selectionEnd ?? start))
      if (end <= start) return ''
      return liveEditor.value.slice(start, end)
    }

    const getLiveLineSnippet = () => {
      if (!liveEditor) return ''
      const code = liveEditor.value
      if (!code) return ''

      const cursor = Math.max(
        0,
        Math.min(
          code.length,
          (typeof liveEditor.selectionEnd === 'number' ? liveEditor.selectionEnd : liveEditor.selectionStart) ?? 0
        )
      )
      const lineStart = code.lastIndexOf('\n', Math.max(0, cursor - 1)) + 1
      const lineBreakIndex = code.indexOf('\n', cursor)
      const lineEnd = lineBreakIndex >= 0 ? lineBreakIndex : code.length
      return code.slice(lineStart, lineEnd)
    }

    const resolveLiveSnippet = (scope = 'smart') => {
      if (!liveEditor) return { code: '', scopeLabel: 'buffer' }
      if (scope === 'all') return { code: liveEditor.value, scopeLabel: 'buffer' }

      const selection = getLiveSelectionSnippet()
      if (selection.trim()) return { code: selection, scopeLabel: 'selection' }

      const line = getLiveLineSnippet()
      if (line.trim()) return { code: line, scopeLabel: 'line' }

      return { code: '', scopeLabel: 'line' }
    }

    const splitLiveExecutionBlocks = (code) => {
      const normalized = String(code ?? '').replace(/\r\n?/g, '\n')
      const lines = normalized.split('\n')
      const blocks = []
      let blockLines = []

      const flushBlock = () => {
        if (blockLines.length === 0) return
        const block = blockLines.join('\n').trim()
        if (block) blocks.push(block)
        blockLines = []
      }

      for (const line of lines) {
        if (!line.trim()) {
          flushBlock()
          continue
        }
        blockLines.push(line)
      }
      flushBlock()
      return blocks
    }

    const runEditorSnippet = (scope = 'smart') => {
      if (!liveEditor) return
      if (!livecodingPlugin || typeof livecodingPlugin.run !== 'function') {
        setLiveStatus('Livecoding plugin is not attached.', 'error')
        return
      }

      const snippet = resolveLiveSnippet(scope)
      const code = snippet.code
      if (!code.trim()) {
        if (scope === 'all') {
          setLiveStatus('Editor is empty.', 'error')
        } else {
          setLiveStatus('Selection/line is empty. Use Shift+Ctrl/Cmd+Enter for full buffer.', 'error')
        }
        return
      }

      if (scope === 'all') {
        const blocks = splitLiveExecutionBlocks(code)
        const previousBlocks = Array.isArray(lastFullBufferBlocks) ? lastFullBufferBlocks : []
        let executedBlocks = 0
        let skippedBlocks = 0
        let executeRemaining = false

        try {
          for (let index = 0; index < blocks.length; index += 1) {
            const block = blocks[index]
            if (!executeRemaining && previousBlocks[index] === block) {
              skippedBlocks += 1
              continue
            }

            executeRemaining = true
            try {
              livecodingPlugin.run(block)
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error)
              throw new Error(`Block ${index + 1}: ${message}`)
            }
            executedBlocks += 1
          }

          lastFullBufferBlocks = blocks
          setLiveStatus(
            `Ran buffer at ${new Date().toLocaleTimeString()} (${executedBlocks} block(s), ${skippedBlocks} unchanged).`,
            'ok'
          )
        } catch (error) {
          const message = error instanceof Error ? error.message : String(error)
          setLiveStatus(`Error: ${message}`, 'error')
          console.error('[hydra] live editor run failed', error)
        }
        return
      }

      lastFullBufferBlocks = null
      try {
        livecodingPlugin.run(code)
        setLiveStatus(`Ran ${snippet.scopeLabel} at ${new Date().toLocaleTimeString()}.`, 'ok')
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error)
        setLiveStatus(`Error: ${message}`, 'error')
        console.error('[hydra] live editor run failed', error)
      }
    }

    if (liveEditor) {
      liveEditor.value = loadLiveSnippet()
      liveEditor.addEventListener('input', persistLiveSnippet)
      liveEditor.addEventListener('keydown', (event) => {
        const wantsRun = (event.ctrlKey || event.metaKey) && event.key === 'Enter'
        if (!wantsRun) return
        event.preventDefault()
        runEditorSnippet(event.shiftKey ? 'all' : 'smart')
      })
    }

    if (liveRunButton) {
      liveRunButton.addEventListener('click', () => runEditorSnippet('smart'))
    }

    if (captureGifToggle) {
      captureGifToggle.addEventListener('click', toggleGifCapture)
    }

    if (captureVideoToggle) {
      captureVideoToggle.addEventListener('click', toggleVideoCapture)
    }

    if (captureDurationInput) {
      const syncCaptureDuration = () => {
        setCaptureDurationSeconds(readCaptureDurationSeconds())
        updateCaptureButtonState()
      }
      captureDurationInput.addEventListener('change', syncCaptureDuration)
      captureDurationInput.addEventListener('blur', syncCaptureDuration)
    }

    if (enableLivecoding) {
      livecodingPlugin = createLivecodingPlugin({
        exposeHelpers: {
          captureFrames,
          captureAndSaveGif,
          captureAndSaveVideo,
          captureAndSaveMp4,
          toggleGifCapture,
          toggleVideoCapture,
          buildFfmpegCommands
        },
        allowedBindings: ['speed', 'bpm', 'fps', 'time', 'update', 'afterUpdate']
      })
      detachLivecoding = runtime.attachPlugin(livecodingPlugin)
      window.livecoding = livecodingPlugin
      window.livecodingDetach = detachLivecoding
      if (livePanel) livePanel.hidden = false
      if (livecodingNote) {
        livecodingNote.innerHTML = 'Live editor enabled: <code>Ctrl/Cmd+Enter</code> runs selection/line. <code>Shift+Ctrl/Cmd+Enter</code> runs full buffer incrementally (unchanged blank-line blocks are skipped). Capture via buttons, <code>captureAndSaveGif()</code>, or <code>captureAndSaveVideo()</code>.'
      }
      setLiveStatus('Ready. Ctrl/Cmd+Enter runs selection/line; Shift+Ctrl/Cmd+Enter runs full buffer incrementally.')
      console.info('[hydra] livecoding plugin attached')
      console.info('[hydra] live editor ready: use panel or livecoding.run(...)')
    } else if (livecodingNote) {
      livecodingNote.innerHTML = 'Live editor disabled. Add <code>?livecoding=1</code>.'
    }

    const originalDispose = runtime.dispose.bind(runtime)
    runtime.dispose = () => {
      if (activeCaptureAbortController) {
        activeCaptureAbortController.abort()
      }
      if (activeCaptureSessionId) {
        void abortCaptureSession(activeCaptureSessionId).catch(() => { })
        activeCaptureSessionId = null
      }
      if (typeof detachLivecoding === 'function') {
        detachLivecoding()
        detachLivecoding = null
      }
      livecodingPlugin = null
      lastFullBufferBlocks = null
      originalDispose()
    }

    console.info('[hydra] ready')
    console.info('[hydra] try: osc(20, 0.1, 0).rotate(0.2).out()')
    console.info('[hydra] capture gif: set Duration (s), then click GIF button or run await captureAndSaveGif({ duration: 3 })')
    console.info('[hydra] capture mp4 (WebCodecs): click Video button or run await captureAndSaveVideo({ duration: 3 })')
    console.info('[hydra] capture frames: await captureFrames({ duration: 2, fps: 60, extension: "png", pickDirectory: true })')
    console.info('[hydra] ffmpeg: buildFfmpegCommands({ fps: 60, ffmpegPattern: "frame-%04d.png" })')
    console.info('[hydra] dispose via: hydra.dispose()')
  </script>
</body>

</html>
